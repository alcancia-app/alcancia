# Revisión automática de cada cambio (y de cada pull request): si algo falla, se ve antes de que llegue a alguien.
# Seguridad: actions fijadas por SHA (Dependabot las actualiza), token de solo lectura, sin credenciales guardadas en el checkout
# y nada de pull_request_target: un pull request de afuera corre sin secretos ni permisos de escritura.
# - comun: sintaxis, privacidad básica, contrato interfaz ↔ apps (Mac, celular y plugins nativos), pruebas de Python (con una IA
#   falsa), de la copia cifrada para el celular, de la interfaz (español/inglés, celular, contraste, misma lógica que Python) y de la
#   app del celular de punta a punta (con un Capacitor falso); y movil/ con sus dependencias exactas, auditoría y `cap sync`.
#   Los proyectos nativos de movil/ (Xcode y Gradle) no se compilan aquí todavía.
name: Revisar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: revisar-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  comun:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Sintaxis
        run: |
          node --check ui/app.js
          node --check ui/copia.js
          for f in movil/host/*.js movil/*.mjs pruebas/*.mjs pruebas/capacitor_falso.js; do node --check "$f"; done
          python3 -m py_compile bin/*.py bin/conectores/*.py pruebas/*.py ejemplos/*.py herramientas/*.py
          python3 -c "import json, glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('ui/idiomas/*.json') + glob.glob('recetas/*.json') + ['ui/demo.json', 'pruebas/casos.json', 'movil/package.json', 'movil/capacitor.config.json']]"
          for f in build.sh herramientas/*.sh pruebas/*.sh; do bash -n "$f"; done
      - name: Privacidad (correos personales, rutas de usuario y RUT)
        run: bash herramientas/revisar_privacidad.sh --generico
      - name: Contrato entre la interfaz y las apps
        run: python3 pruebas/contrato.py
      - name: Página de conexiones al día con los conectores
        run: python3 herramientas/generar_conectar.py --revisar
      - name: Pruebas de Python
        run: python3 pruebas/test_python.py
      - name: Copia para el celular (cifrado, formato y lo que viaja)
        run: node pruebas/copia.mjs
      - name: Pruebas de la interfaz
        run: |
          npm i --no-save --ignore-scripts --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p capturas
          PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" CAPTURAS=capturas node pruebas/interfaz.mjs
          PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" node pruebas/movil.mjs
      - name: "Celular: dependencias exactas, auditoría y cap sync"
        # npm ci instala solo lo de package-lock.json; movil/.npmrc deja fuera los scripts de instalación.
        working-directory: movil
        run: |
          npm ci
          npm audit --audit-level=high
          npx cap telemetry off
          npm run sync
      - name: Contrato con los plugins oficiales instalados
        run: python3 pruebas/contrato.py
      - name: Capturas para revisar a ojo
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: capturas, path: capturas, retention-days: 14, if-no-files-found: ignore }

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: ¿Cambió algo de la app de Mac?
        id: cambio
        # Lo que viene del evento entra por variables de entorno, nunca pegado en el guion.
        env:
          ANTES: ${{ github.event.before }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "push" ] || ! git cat-file -e "$ANTES" 2>/dev/null || git diff --name-only "$ANTES" HEAD | grep -qE '^(app/|herramientas/empaquetar\.sh|build\.sh)'; then echo "si=1" >> "$GITHUB_OUTPUT"; fi
      - name: Compilar
        if: steps.cambio.outputs.si == '1'
        run: cd app && swift build -c release
