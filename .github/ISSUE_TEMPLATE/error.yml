name: 🐞 Algo falla / Something's broken
description: Cuéntanos qué pasó. No incluyas montos, cartolas ni datos de tus cuentas. / Tell us what happened. Don't include amounts, statements or account data.
labels: [error]
body:
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasó? / What happened?
      description: Qué hiciste, qué esperabas y qué pasó en cambio.
    validations: { required: true }
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema / System
      options: [Mac, Windows, Linux, Vista previa en el navegador / Browser preview]
    validations: { required: true }
  - type: input
    id: banco
    attributes:
      label: Banco o billetera (si tiene que ver) / Bank or wallet (if relevant)
  - type: input
    id: version
    attributes:
      label: Versión de Alcancía / Alcancía version
      description: Ajustes → Acerca de Alcancía.
  - type: textarea
    id: extra
    attributes:
      label: Algo más (capturas sin datos reales, pasos para repetirlo) / Anything else
